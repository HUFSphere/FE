    <stop offset="0" stop-color="#6B5A4C"/>
    <stop offset="1" stop-color="#A8957F" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadeRight" gradientUnits="userSpaceOnUse" x1="710" y1="80" x2="880" y2="80">
